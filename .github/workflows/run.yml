name: CS Dashboard Automation

on:
  schedule:
    - cron: "0 1 * * *"    # 08:00 WIB
    - cron: "0 10 * * *"   # 17:00 WIB
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Create service account file
      run: |
        echo '${{ secrets.GDRIVE_CREDENTIAL_JSON }}' > service_account.json

    - name: Run automation
      run: python main.py
