name: CS Dashboard Automation

on:
  schedule:
    - cron: "0 00 * * *"    # 08:00 WIB
    - cron: "0 07 * * *"   # 17:00 WIB
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"   # optional (biar lebih cepat)

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create service account file
      run: |
        echo '${{ secrets.GDRIVE_CREDENTIAL_JSON }}' > service_account.json

    - name: Run automation
      run: python main.py
